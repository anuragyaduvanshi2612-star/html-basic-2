<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 way to add css</title>
    <link rel="stylesheet" href="style.css">
    <style>
        p{
            background-color: violet;
        }
    </style>
</head>
<body>
    <!--Inline css-->
    <h1 style="background-color: aqua;">This is brand new heading</h1>

    <!--Internal css-->
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Eveniet, iusto?</p>

    <!--External css-->
    <article>
Lorem ipsum dolor sit, amet consectetur adipisicing elit. Temporibus nulla dicta inventore atque, error ea impedit odio? Velit, vitae vero.
    </article>
</body>
</html>
